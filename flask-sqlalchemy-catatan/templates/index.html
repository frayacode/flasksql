<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplikasi Catatan - Flask SQLAlchemy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 720px;">
    <h1 class="h3 mb-4">Aplikasi Catatan</h1>

    <form action="{{ url_for('tambah_catatan') }}" method="post" class="card card-body mb-4">
      <input type="text" name="judul" class="form-control mb-2" placeholder="Judul" maxlength="100" required>
      <textarea name="isi" class="form-control mb-2" rows="3" placeholder="Isi catatan" required></textarea>
      <button type="submit" class="btn btn-primary">Tambah Catatan</button>
    </form>

    {% for catatan in catatan_list %}
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">{{ catatan.judul }}</h5>
          <p class="card-text">{{ catatan.isi }}</p>
          <details class="mb-2">
            <summary class="text-primary" style="cursor:pointer">Edit</summary>
            <form action="{{ url_for('edit_catatan', id=catatan.id) }}" method="post" class="mt-2">
              <input type="text" name="judul" class="form-control mb-2" value="{{ catatan.judul }}" maxlength="100" required>
              <textarea name="isi" class="form-control mb-2" rows="3" required>{{ catatan.isi }}</textarea>
              <button type="submit" class="btn btn-sm btn-success">Simpan</button>
            </form>
          </details>
          <a href="{{ url_for('hapus_catatan', id=catatan.id) }}" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('Hapus catatan ini?')">Hapus</a>
        </div>
      </div>
    {% else %}
      <p class="text-muted">Belum ada catatan.</p>
    {% endfor %}
  </div>
</body>
</html>
